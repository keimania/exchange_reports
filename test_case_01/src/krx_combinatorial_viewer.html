  if(ot==="조건부지정가"){
    if(AFTER_HOURS.has(sess)) return["접수거부","조건부지정가호가는 시간외시장 불가"];
    if(COND_BANNED_STAT.has(stat)) return["접수거부",stat+"은(는) 조건부지정가호가 불가"];
  }
  if(stat==="정리매매종목"&&["시장가","조건부지정가","경쟁대량매매","중간가","스톱지정가"].includes(ot))
    return["접수거부","정리매매종목은 "+ot+" 불가"];
  if(cond==="IOC"||cond==="FOK"){
    if(IOC_FOK_BANNED.has(ot)) return["접수거부",ot+"은(는) "+cond+" 조건 부여 불가"];
    if(SINGLE_SESSIONS.has(sess)) return["접수거부","단일가매매 참여호가 접수시간에는 "+cond+" 불가"];
    if(AFTER_HOURS.has(sess)) return["접수거부","시간외시장에서는 "+cond+" 불가"];
    if(sess==="VI단일가") return["접수거부","VI단일가 시간에는 "+cond+" 불가"];
    if(stat==="정리매매종목") return["접수거부","정리매매종목은 "+cond+" 불가"];
    if(stat==="신규상장종목"&&sess==="시가단일가") return["접수거부","신규상장종목 최초가격결정시 "+cond+" 불가"];
    if(SINGLE_PRICE_ONLY.has(stat)) return["접수거부",stat+" 단일가매매 중 "+cond+" 불가"];
  }
  if(["시간외종가_장전","시간외종가_장후"].includes(sess)&&ot!=="지정가")
    return["접수거부","시간외종가매매에서는 지정가호가만 가능"];
  if(sess==="시간외단일가"&&ot!=="지정가")
    return["접수거부","시간외단일가매매에서는 지정가호가만 가능"];
  const priceRelevant=ot!=="시장가"&&ot!=="경쟁대량매매";
  if(priceRelevant&&price==="가격제한초과"&&stat!=="정리매매종목")
    return["접수거부","가격제한(상한가/하한가) 초과"];
  if(priceRelevant&&price==="호가단위불일치")
    return["접수거부","호가가격단위에 부적합"];
  // success
  let notes=[];
  if(SINGLE_PRICE_ONLY.has(stat)&&sess==="접속매매") notes.push(stat+" 단일가매매 전환");
  if(ot==="조건부지정가"&&sess==="종가단일가") notes.push("시장가호가로 전환");
  if(["투자경고종목","투자위험종목","투자유의종목"].includes(stat)&&side==="매수") notes.push("현금증거금100%");
  if(stat==="신규상장종목") notes.push("확대가격제한폭");
  if(cond==="IOC") notes.push("부분체결후잔량취소");
  if(cond==="FOK") notes.push("전량체결불가시전량취소");
  if(notes.length) return["조건부성공",notes.join("; ")];
  return["접수성공",""];
}

// ===== Render functions =====
function dimLabel(k){
  return{order_type:'호가유형',side:'매도/매수',condition:'호가조건',session:'매매시간대',stock_status:'종목상태',security:'증권종류',price:'가격조건'}[k]||k;
}
function cellContent(d){
  const ok=(d['성공']||0)+(d['조건부']||0),fail=d['거부']||0,total=ok+fail;
  if(!total)return{cls:'cna',text:'-',title:'해당없음'};
  const pct=ok/total*100;
  let cls;
  if(pct>=100)cls='c100';else if(pct>=90)cls='c90';else if(pct>=80)cls='c80';else if(pct>=70)cls='c70';
  else if(pct>=60)cls='c60';else if(pct>=50)cls='c50';else if(pct>=40)cls='c40';else if(pct>=30)cls='c30';
  else if(pct>=20)cls='c20';else if(pct>=10)cls='c10';else cls='c0';
  return{cls,text:pct.toFixed(0)+'%',title:`성공:${(d['성공']||0).toLocaleString()} 조건부:${(d['조건부']||0).toLocaleString()} 거부:${fail.toLocaleString()} (${total.toLocaleString()}건)`};
}

const legendHTML='<div class="legend">접수성공률: <span class="c0">0%</span><span class="c10">10</span><span class="c20">20</span><span class="c30">30</span><span class="c40">40</span><span class="c50">50</span><span class="c60">60</span><span class="c70">70</span><span class="c80">80</span><span class="c90">90</span><span class="c100">100%</span><span class="cna">N/A</span></div>';

function renderAll(){
  const m=DATA.metadata,main=document.getElementById('mainContent');
  const ok=m.results_summary['성공']||0,cond=m.results_summary['조건부']||0,fail=m.results_summary['거부']||0,total=m.total_combinations;
  document.getElementById('topStats').innerHTML=`
    <div class="stat"><b>${total.toLocaleString()}</b><small>전체조합</small></div>
    <div class="stat"><b style="color:#68d391">${ok.toLocaleString()}</b><small>접수성공</small></div>
    <div class="stat"><b style="color:#f6e05e">${cond.toLocaleString()}</b><small>조건부</small></div>
    <div class="stat"><b style="color:#fc8181">${fail.toLocaleString()}</b><small>접수거부</small></div>
    <div class="stat"><b>${((1-fail/total)*100).toFixed(1)}%</b><small>접수가능률</small></div>`;

  let h='';
  // Overview
  h+=`<div class="sec" id="overview"><div class="stitle">전체 테스트 조합 요약</div><div class="sg">
    ${Object.entries(m.dimensions).map(([k,v])=>`<div class="sc"><h4>${dimLabel(k)}</h4><div class="n">${v}</div><div class="d">값 수</div></div>`).join('')}
    <div class="sc"><h4>전체 조합</h4><div class="n">${total.toLocaleString()}</div><div class="d">${Object.values(m.dimensions).join(' × ')}</div></div>
    <div class="sc" style="border-color:var(--ok)"><h4>접수 가능</h4><div class="n" style="color:var(--ok)">${(ok+cond).toLocaleString()}</div><div class="d">${((ok+cond)/total*100).toFixed(1)}%</div></div>
    <div class="sc" style="border-color:var(--fail)"><h4>접수 거부</h4><div class="n" style="color:var(--fail)">${fail.toLocaleString()}</div><div class="d">${(fail/total*100).toFixed(1)}%</div></div>
  </div></div>`;

  // 1D
  h+='<div class="sec" id="dim1d"><div class="stitle">1D 차원별 접수성공/거부 분포</div>';
  for(const[dk,dd] of Object.entries(DATA.dim_coverage)){
    h+=`<div style="margin-bottom:1rem"><h4 style="font-size:.8rem;font-weight:700;margin-bottom:.4rem">${dimLabel(dk)}</h4>`;
    for(const[val,c] of Object.entries(dd).sort((a,b)=>a[0].localeCompare(b[0]))){
      const t=(c['성공']||0)+(c['조건부']||0)+(c['거부']||0),okP=(c['성공']||0)/t*100,coP=(c['조건부']||0)/t*100,faP=(c['거부']||0)/t*100;
      h+=`<div class="bar-grid"><div style="font-weight:600;overflow:hidden;text-overflow:ellipsis">${val}</div>
        <div class="bar-track" title="성공:${c['성공']||0} 조건부:${c['조건부']||0} 거부:${c['거부']||0}">
        <div class="bar-ok" style="width:${okP}%"></div><div class="bar-cond" style="width:${coP}%"></div><div class="bar-fail" style="width:${faP}%"></div>
        </div><div style="text-align:right">${(okP+coP).toFixed(1)}%</div></div>`;
    }
    h+='</div>';
  }
  h+='</div>';

  // Reject reasons
  const rr=Object.entries(DATA.reject_reasons_top50).sort((a,b)=>b[1]-a[1]).slice(0,20);
  const maxR=rr[0]?.[1]||1;
  h+='<div class="sec" id="reject"><div class="stitle">접수거부 사유 Top 20</div>';
  h+='<table class="rrtbl"><thead><tr><th>#</th><th>거부 사유</th><th style="width:100px">건수</th><th style="width:200px">비율</th></tr></thead><tbody>';
  rr.forEach(([r,c],i)=>{
    const p=c/fail*100,bw=c/maxR*100;
    h+=`<tr><td>${i+1}</td><td>${r}</td><td style="text-align:right">${c.toLocaleString()}</td><td><span class="pct-bar" style="width:${bw}%"></span>${p.toFixed(1)}%</td></tr>`;
  });
  h+='</tbody></table></div>';

  // 2D Heatmaps
  const cfgs=[
    {id:'hm-ot-sess',key:'order_type×session',title:'호가유형 × 매매시간대',rows:'order_type',cols:'session'},
    {id:'hm-ot-stat',key:'order_type×stock_status',title:'호가유형 × 종목상태',rows:'order_type',cols:'stock_status'},
    {id:'hm-ot-sec',key:'order_type×security',title:'호가유형 × 증권종류',rows:'order_type',cols:'security'},
    {id:'hm-ot-cond',key:'order_type×condition',title:'호가유형 × 호가조건',rows:'order_type',cols:'condition'},
    {id:'hm-sess-stat',key:'session×stock_status',title:'매매시간대 × 종목상태',rows:'session',cols:'stock_status'},
    {id:'hm-ot-price',key:'order_type×price',title:'호가유형 × 가격조건',rows:'order_type',cols:'price'},
    {id:'hm-cond-sess',key:'condition×session',title:'호가조건 × 매매시간대',rows:'condition',cols:'session'},
    {id:'hm-sec-sess',key:'security×session',title:'증권종류 × 매매시간대',rows:'security',cols:'session'}
  ];
  cfgs.forEach(cfg=>{
    const mat=DATA.cross_2d[cfg.key];if(!mat)return;
    const rows=DATA.dimensions[cfg.rows],cols=DATA.dimensions[cfg.cols];
    h+=`<div class="sec" id="${cfg.id}"><div class="stitle">${cfg.title} 접수성공률 히트맵</div>${legendHTML}`;
    h+='<div class="hmwrap"><table class="hm"><thead><tr><th class="rh">'+dimLabel(cfg.rows)+' \\ '+dimLabel(cfg.cols)+'</th>';
    cols.forEach(c=>h+=`<th>${c}</th>`);
    h+='</tr></thead><tbody>';
    rows.forEach(r=>{
      h+=`<tr><td class="rh">${r}</td>`;
      cols.forEach(c=>{const d=mat[r+'|'+c]||{'성공':0,'거부':0,'조건부':0};const cc=cellContent(d);h+=`<td class="${cc.cls}" title="${cc.title}">${cc.text}</td>`;});
      h+='</tr>';
    });
    h+='</tbody></table></div></div>';
  });

  // 3D
  h+=`<div class="sec" id="hm3d"><div class="stitle">3D 교차 히트맵 (슬라이스 선택)</div>
    <div class="sel3d"><label>3D 매트릭스:</label>
    <select id="sel3dMatrix" onchange="update3D()">
      <option value="order_type×session×stock_status">호가유형 × 시간대 × 종목상태</option>
      <option value="order_type×condition×session">호가유형 × 호가조건 × 시간대</option>
      <option value="order_type×security×stock_status">호가유형 × 증권종류 × 종목상태</option>
    </select>
    <label>슬라이스(3번째 차원):</label><select id="sel3dSlice" onchange="render3D()"></select></div>
    ${legendHTML}<div id="hm3d_content"></div></div>`;

  // TC Explorer
  h+=`<div class="sec" id="tc-explore"><div class="stitle">개별 TC 탐색기 (279,936건 실시간 생성)</div>
    <div class="tcsearch">
    <label>호가유형:</label><select id="f_ot"><option value="">전체</option>${DATA.dimensions.order_type.map(v=>'<option>'+v+'</option>').join('')}</select>
    <label>매도/매수:</label><select id="f_side"><option value="">전체</option>${DATA.dimensions.side.map(v=>'<option>'+v+'</option>').join('')}</select>
    <label>호가조건:</label><select id="f_cond"><option value="">전체</option>${DATA.dimensions.condition.map(v=>'<option>'+v+'</option>').join('')}</select>
    <label>시간대:</label><select id="f_sess"><option value="">전체</option>${DATA.dimensions.session.map(v=>'<option>'+v+'</option>').join('')}</select>
    <label>종목상태:</label><select id="f_stat"><option value="">전체</option>${DATA.dimensions.stock_status.map(v=>'<option>'+v+'</option>').join('')}</select>
    <label>증권:</label><select id="f_sec"><option value="">전체</option>${DATA.dimensions.security.map(v=>'<option>'+v+'</option>').join('')}</select>
    <label>가격:</label><select id="f_price"><option value="">전체</option>${DATA.dimensions.price.map(v=>'<option>'+v+'</option>').join('')}</select>
    <label>결과:</label><select id="f_result"><option value="">전체</option><option>접수성공</option><option>조건부성공</option><option>접수거부</option></select>
    <button onclick="searchTCs()" style="padding:4px 12px;background:var(--pl);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:.72rem">검색</button>
    <span id="tcCount" style="font-size:.7rem;color:var(--txtl)"></span>
    </div><div id="tcResults" style="max-height:500px;overflow:auto;border:1px solid var(--bdr);border-radius:8px;background:#fff"></div></div>`;

  main.innerHTML=h;
  update3D();
  setupNav();
}

function update3D(){
  const mk=document.getElementById('sel3dMatrix').value,parts=mk.split('×'),sd=parts[2];
  const sel=document.getElementById('sel3dSlice');
  sel.innerHTML=DATA.dimensions[sd].map(v=>'<option>'+v+'</option>').join('');
  render3D();
}
function render3D(){
  const mk=document.getElementById('sel3dMatrix').value,sv=document.getElementById('sel3dSlice').value;
  const parts=mk.split('×'),rd=parts[0],cd=parts[1],sd=parts[2];
  const mat=DATA.cross_3d[mk];if(!mat)return;
  const rows=DATA.dimensions[rd],cols=DATA.dimensions[cd],el=document.getElementById('hm3d_content');
  let h=`<p style="font-size:.72rem;color:var(--txtl);margin-bottom:.5rem">${dimLabel(sd)} = <b>${sv}</b></p>`;
  h+='<div class="hmwrap"><table class="hm"><thead><tr><th class="rh">'+dimLabel(rd)+' \\ '+dimLabel(cd)+'</th>';
  cols.forEach(c=>h+=`<th>${c}</th>`);h+='</tr></thead><tbody>';
  rows.forEach(r=>{
    h+=`<tr><td class="rh">${r}</td>`;
    cols.forEach(c=>{const d=mat[r+'|'+c+'|'+sv]||{'성공':0,'거부':0,'조건부':0};const cc=cellContent(d);h+=`<td class="${cc.cls}" title="${cc.title}">${cc.text}</td>`;});
    h+='</tr>';
  });
  h+='</tbody></table></div>';el.innerHTML=h;
}

function searchTCs(){
  const f={ot:gv('f_ot'),side:gv('f_side'),cond:gv('f_cond'),sess:gv('f_sess'),stat:gv('f_stat'),sec:gv('f_sec'),price:gv('f_price'),result:gv('f_result')};
  function gv(id){return document.getElementById(id).value}
  const ots=f.ot?[f.ot]:DATA.dimensions.order_type;
  const sides=f.side?[f.side]:DATA.dimensions.side;
  const conds=f.cond?[f.cond]:DATA.dimensions.condition;
  const sesss=f.sess?[f.sess]:DATA.dimensions.session;
  const stats=f.stat?[f.stat]:DATA.dimensions.stock_status;
  const secs=f.sec?[f.sec]:DATA.dimensions.security;
  const prices=f.price?[f.price]:DATA.dimensions.price;
  let results=[],count=0,limit=500;
  for(const ot of ots)for(const side of sides)for(const cond of conds)for(const sess of sesss)
    for(const stat of stats)for(const sec of secs)for(const price of prices){
      const[res,reason]=evaluate(ot,side,cond,sess,stat,sec,price);
      if(f.result&&res!==f.result)continue;
      count++;
      if(results.length<limit)results.push({ot,side,cond,sess,stat,sec,price,res,reason});
    }
  document.getElementById('tcCount').textContent=`${count.toLocaleString()}건 중 ${Math.min(count,limit)}건 표시`;
  let h='<table class="tctbl"><thead><tr><th>#</th><th>호가유형</th><th>매도/매수</th><th>호가조건</th><th>시간대</th><th>종목상태</th><th>증권</th><th>가격</th><th>결과</th><th>사유</th></tr></thead><tbody>';
  results.forEach((t,i)=>{
    const cls=t.res==='접수성공'?'res-ok':(t.res==='접수거부'?'res-fail':'res-cond');
    h+=`<tr><td>${i+1}</td><td>${t.ot}</td><td>${t.side}</td><td>${t.cond}</td><td>${t.sess}</td><td>${t.stat}</td><td>${t.sec}</td><td>${t.price}</td><td class="${cls}">${t.res}</td><td style="font-size:.65rem">${t.reason}</td></tr>`;
  });
  h+='</tbody></table>';
  document.getElementById('tcResults').innerHTML=h;
}

function setupNav(){
  const secs=document.querySelectorAll('.sec'),nl=document.querySelectorAll('.nav a');
  window.addEventListener('scroll',()=>{let c='';secs.forEach(s=>{if(window.scrollY>=s.offsetTop-130)c=s.id});nl.forEach(l=>{l.classList.remove('act');if(l.getAttribute('href')==='#'+c)l.classList.add('act')})});
  document.querySelectorAll('.nav a').forEach(l=>{l.addEventListener('click',e=>{e.preventDefault();document.querySelector(l.getAttribute('href'))?.scrollIntoView({behavior:'smooth'})})});
}

renderAll();
</script>
